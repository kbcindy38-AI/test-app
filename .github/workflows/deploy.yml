name: Build and deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in Azure Container Registry
        uses: azure/CLI@v2
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          APP_VERSION: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        with:
          azcliversion: latest
          inlineScript: |
            az acr build \
              --registry "$ACR_NAME" \
              --image "hello-svc:sha-$GIT_SHA" \
              --build-arg APP_VERSION="$APP_VERSION" \
              --build-arg GIT_SHA="$GIT_SHA" \
              .

      - name: Deploy image to Azure Container Apps
        uses: azure/CLI@v2
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          GIT_SHA: ${{ github.sha }}
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --image "$ACR_NAME.azurecr.io/hello-svc:sha-$GIT_SHA"
            az containerapp ingress update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP_NAME" \
              --target-port 8080
